name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Regenerates the content-hashed cache/version identifiers so the
      # deployed artifact can never disagree with itself about which
      # app.js/styles.css it points at, even if a contributor forgot to run
      # this locally before merging.
      - name: Generate content-hashed versions
        run: node scripts/generate-version.js

      - name: Run smoke checks
        run: npm test

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css sw.js manifest.json LICENSE THIRD_PARTY_NOTICES.md _site/
          mkdir -p _site/assets _site/vendor
          rsync -av --delete --exclude '.DS_Store' assets/ _site/assets/
          rsync -av --delete vendor/ _site/vendor/
          find _site -name '.DS_Store' -delete

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
