name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke checks
        run: npm test

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css sw.js LICENSE THIRD_PARTY_NOTICES.md _site/
          mkdir -p _site/assets _site/vendor
          rsync -av --delete --exclude '.DS_Store' assets/ _site/assets/
          rsync -av --delete vendor/ _site/vendor/
          find _site -name '.DS_Store' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
